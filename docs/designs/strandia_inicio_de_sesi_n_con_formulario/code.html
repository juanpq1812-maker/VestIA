<form class="flex flex-col gap-lg w-full">
<div class="flex flex-col gap-sm">

<input class="w-full bg-white/10 border-white/20 text-white placeholder:text-[#FAF0E6]/40 rounded-lg py-3 px-4 focus:ring-1 focus:ring-[#8B9E8A] focus:border-[#8B9E8A] outline-none transition-all" id="email" placeholder="tu@email.com" type="email">
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-[#FAF0E6]" for="password">Contraseña</label>
<input class="w-full bg-white/10 border-white/20 text-white placeholder:text-[#FAF0E6]/40 rounded-lg py-3 px-4 focus:ring-1 focus:ring-[#8B9E8A] focus:border-[#8B9E8A] outline-none transition-all" id="password" placeholder="••••••••" type="password">
</div>
<button class="w-full bg-[#8B9E8A] text-white py-4 rounded-xl font-label-md text-label-md active:scale-95 transition-all duration-200 shadow-lg shadow-[#1c1c1a]/20" type="submit">

</a>

<div class="mt-lg text-center">

</div>

</p></div>
</div>

<!-- Micro-interaction logic -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('scale-95');
            });
        });
    </script>
