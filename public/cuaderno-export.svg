<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid meet" role="presentation">
  <!--
    COPIA de cuaderno.svg — SOLO para composeStyleJournalImage.ts (Fase 4,
    export a imagen). NO se usa en pantalla (StyleJournal.tsx sigue
    apuntando a cuaderno.svg).

    Única diferencia: baseFrequency del grano de papel (filter#grain) es
    2.16 2.04 acá vs 0.72 0.68 en cuaderno.svg — exactamente x3.

    Por qué: baseFrequency de feTurbulence es en unidades de userSpace (por
    unidad de viewBox), no por píxel de pantalla. En pantalla el cuaderno
    se renderiza a ~300px de ancho (~0.75 px/unidad); en el export mide
    ~907px (84% de 1080) — ~2.27 px/unidad, ~3x más denso. Sin compensar,
    el mismo ciclo de ruido se estira sobre 3x más píxeles y el grano se ve
    como manchas en vez de fibra fina. Medido, no una suposición: ver
    tmp-capturas/ en el PR de Style Journal para el antes/después a
    resolución nativa (1080x1920).

    Si cambias CUALQUIER otra cosa de cuaderno.svg (espiral, sombra, color
    de papel), replícalo acá también — y si cambias el ANCHO al que se
    renderiza el cuaderno en pantalla o en el export, recalcula el
    multiplicador (no asumas que sigue siendo x3). Los dos archivos se
    desincronizan en silencio si uno se edita sin el otro.
  -->
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="2.16 2.04" numOctaves="4" seed="5" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="lightNoise"><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="lightNoise" mode="multiply" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="page-shadow" x="-12%" y="-5%" width="130%" height="120%">
      <feDropShadow dx="-4" dy="5" stdDeviation="9" flood-color="#1c0e00" flood-opacity="0.18"/>
    </filter>
    <filter id="ambient-shadow" x="-20%" y="-8%" width="150%" height="130%">
      <feGaussianBlur stdDeviation="12" in="SourceGraphic"/>
    </filter>
    <mask id="paper-mask">
