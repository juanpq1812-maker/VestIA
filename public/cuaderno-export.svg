    </mask>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111"/><stop offset="30%" stop-color="#3a3a3a"/>
      <stop offset="55%" stop-color="#666666"/><stop offset="75%" stop-color="#2e2e2e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="spine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c0e00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1c0e00" stop-opacity="0"/>
    </linearGradient>
  </defs>

